server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: orders-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orders}
    username: ${DB_USER:orders}
    password: ${DB_PASSWORD:orders}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 20

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis
    redis:
      time-to-live: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info

outbox:
  publish:
    batch-size: 50
    fixed-delay: 1000
    lock-timeout-seconds: 30

orders:
  realtime:
    # Redis Pub/Sub channel for broadcasting order status updates across multiple Orders Service instances.
    redis-channel: orders.status
